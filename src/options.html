<!DOCTYPE html>
<html>
<head>
    <title>LinkedIn Anti-Promotion Options</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
        }
        label {
            display: block;
            margin: 10px 0;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        textarea {
            width: 100%;
            min-height: 80px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px;
            font-family: inherit;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0077b5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005885;
        }
        #status {
            margin-top: 10px;
            color: green;
        }
    </style>
</head>
<body>
    <h2>LinkedIn Anti-Promotion Settings</h2>
    <form id="options-form">
        <label>
            <input type="checkbox" id="hide-promoted" checked>
            Hide "Promoted" posts
        </label>
        <label>
            <input type="checkbox" id="hide-suggested" checked>
            Hide "Suggested" posts
        </label>
        <label>
            <input type="checkbox" id="hide-custom">
            Hide posts matching custom keywords/companies
        </label>
        <label for="custom-keywords">Custom keywords/companies (comma separated):</label>
        <textarea id="custom-keywords" rows="3" placeholder="example: Microsoft, AI, sales"></textarea>
        <button type="submit">Save Settings</button>
    </form>
    <div id="status"></div>

    <script src="options.js"></script>
</body>
</html>
